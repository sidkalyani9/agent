name: Pantry checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pantry_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pantry_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PANTRY_TEST_POSTGRES_URL: postgresql://pantry_test:disposable-ci-only@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pip check
      - run: npm ci
      - run: npm run build
      - run: npm test -- --junitxml=test-results/backend.xml
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python -m pip_audit -r backend/requirements.txt --no-deps --disable-pip
      - run: npm audit --audit-level=high
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pantry-python-release
          path: release/
          if-no-files-found: error
          retention-days: 14
